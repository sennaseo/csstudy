<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: 아이폰 노치 영역까지 배경이 차게 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- theme-color: 안드로이드 크롬 주소창 색. 브랜드 초록(Feather Green)으로. -->
    <meta name="theme-color" content="#58CC02" />
    <title>csStudy — 개발 사고 회복</title>

    <!-- ─── PWA: 홈 화면에 앱처럼 설치 가능 ─── -->
    <!-- 상대 경로("./") — 루트 배포든 /csstudy/ 하위 경로(GitHub Pages)든 다 맞는다 -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <!-- iOS 사파리는 manifest 만으로 부족 — 전용 태그 필요 -->
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="csStudy" />

    <!-- Pretendard — 한글이 예쁘게 나오는 무료 폰트 -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"
    />

    <!-- 듀오링고 느낌의 둥근 폰트 2종 (Google Fonts)
         - Baloo 2 → font-round : 숫자/영문 라벨용 ("XP 120", "LV 3")
         - Jua     → font-display : 완료 화면 큰 한글 타이틀용
         preconnect 는 "폰트 서버에 미리 악수해두기" — 실제 다운로드가 조금 더 빨라진다.
         display=swap 은 "폰트 받는 동안 기본 글꼴로라도 먼저 보여줘" 옵션(빈 화면 방지). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&family=Jua&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="text-ink-700 font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
