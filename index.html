<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: 아이폰 노치 영역까지 배경이 차게 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- theme-color: 안드로이드 크롬 주소창 색. 브랜드 초록(Feather Green)으로. -->
    <meta name="theme-color" content="#FBFAF7" />
    <title>csStudy — 개발 사고 회복</title>

    <!-- ─── PWA: 홈 화면에 앱처럼 설치 가능 ─── -->
    <!-- 상대 경로("./") — 루트 배포든 /csstudy/ 하위 경로(GitHub Pages)든 다 맞는다 -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <!-- iOS 사파리는 manifest 만으로 부족 — 전용 태그 필요 -->
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="csStudy" />

    <!-- Pretendard — 한글이 예쁘게 나오는 무료 폰트 -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"
    />

    <!-- ─── 손그림(스케치) 테마 폰트 ───────────────────────────
         - Gaegu       → font-hand / font-display : 손글씨 느낌의 한글 폰트. 제목·버튼 라벨용.
         - Nanum Pen Script → 더 흘려쓴 한글 손글씨. 말풍선/캡션 같은 "낙서" 자리.
         - Gamja Flower → 본문에 쓸 만큼 또박또박한 손글씨.
         - Patrick Hand → 숫자/영문 라벨(라틴 글리프)용 손글씨.
         한 폰트에 없는 글자는 자동으로 뒤 폰트로 넘어간다(폰트 fallback). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gaegu:wght@300;400;700&family=Gamja+Flower&family=Nanum+Pen+Script&family=Patrick+Hand&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="text-ink-700 font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
