<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: 아이폰 노치 영역까지 배경이 차게
         user-scalable=no: 앱 웹뷰에서 손가락 줌으로 화면이 커지거나 비율이 틀어지는 것 차단 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- theme-color: 안드로이드 크롬 주소창 색. 배경색(paper #F7F8FA)과 똑같이 맞춰서
         주소창과 앱 화면이 이어져 보이게 한다. -->
    <meta name="theme-color" content="#F7F8FA" />
    <title>csStudy — 개발 사고 회복</title>
    <!-- description: 브라우저/검색 미리보기에 뜨는 한 줄. manifest 의 description 과 같은 문장으로 맞춰둔다
         (manifest 는 설치된 앱용, 이 태그는 웹으로 열었을 때용 — 둘 다 있어야 어디서든 같게 보인다) -->
    <meta name="description" content="하루 1~5문제, 출퇴근길 CS 학습" />

    <!-- ─── PWA: 홈 화면에 앱처럼 설치 가능 ─── -->
    <!-- 상대 경로("./") — 루트 배포든 /csstudy/ 하위 경로(GitHub Pages)든 다 맞는다 -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <!-- iOS 사파리는 manifest 만으로 부족 — 전용 태그 필요 -->
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="csStudy" />

    <!-- ─── 폰트 ───────────────────────────────────────────────
         Gaegu Bold 1종(브랜드 로고·보상 제목)만 앱에 내장, 본문은 시스템 폰트.
         @font-face 선언은 src/index.css 에. 외부 폰트 요청은 0 이다
         (예전엔 Google Fonts 를 불러왔는데 오프라인에서 글씨가 깨지고
         사용자 IP 가 남의 서버로 나가서 없앴다). -->
  </head>
  <body class="text-ink-700 font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
